name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/embarko-challenge/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Check the Internet Congestion Lab
        working-directory: apps/embarko-challenge
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
